    duration: 2.0
    weight: 1.0
    cooldown: 50

  - id: laugh_track
    text: "ㅋㅋㅋㅋㅋㅋㅋㅋ"
    asset: images/웃음.png
    sfx: sfx/웃음.mp3
    triggers: ["ㅋㅋ", "ㅎㅎ", "웃겨", "하하", "개웃", "못참"]
    placement: top
    duration: 1.6
    weight: 1.3
    cooldown: 20
