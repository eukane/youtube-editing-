name: default
description: >
  게임 실황 편집용 기본 밈 팩.

  각 밈은 자막 문구(text)와 함께 이미지·효과음 자리(asset/sfx)를 미리 잡아 뒀습니다.
  파일이 없으면 자막 밈으로 나가고, 아래 경로에 파일을 넣는 순간 그림·소리로 자동 승격됩니다.

      assets/memepacks/default/images/무야호.png
      assets/memepacks/default/sfx/무야호.mp3

  파일 이름은 아래 각 밈의 asset / sfx 에 적힌 그대로 맞춰 주세요.
  (그냥 아무 폴더에 파일을 쏟아붓고 파일명을 트리거로 쓰고 싶다면
   memes.asset_dirs 설정을 쓰세요. README 참고)

# duration  : 화면에 떠 있는 시간(초)
# triggers  : 대사에 이 문자열이 들어가면 발동
# events    : hype(오디오 피크) / silence(정적) / timeskip(시간 점프)
# cooldown  : 같은 밈이 다시 나오기까지 최소 간격(초)
# weight    : 여러 밈이 동시에 걸릴 때 우선순위
# placement : top / center / bottom / left / right (이미지·영상 위치)
memes:
  # ======================= 사망 · 실패 =======================
  - id: death_again
    text: "☠️ 또 죽었습니다"
    asset: images/사망.png
    sfx: sfx/사망.mp3
    triggers: ["죽었", "죽네", "죽음", "사망", "뒤졌", "리스폰", "관짝", "또 죽"]
    placement: top
    duration: 2.0
    weight: 1.4
    cooldown: 20

  - id: gg
    text: "GG 😇"
    asset: images/gg.png
    sfx: sfx/실패.mp3
    triggers: ["망했", "망함", "끝났", "졌다", "졌네", "털렸", "나가리", "지디"]
    placement: center
    style: MemeCenter
    duration: 1.6
    weight: 1.3
    cooldown: 30

  - id: skill_issue
    text: "( 실 력 문 제 )"
    asset: images/실력문제.png
    triggers: ["실수", "아 진짜", "왜이래", "왜 저래", "손이", "미스", "삑살", "빗나"]
    placement: top
    duration: 2.0
    weight: 1.0
    cooldown: 40

  - id: ambush
    text: "🚨 뒤 조 심 🚨"
    asset: images/뒤조심.png
    sfx: sfx/경보.mp3
    triggers: ["뒤에", "언제 왔", "어디서", "기습", "당했", "뒤통수"]
    placement: top
    duration: 1.8
    weight: 1.1
    cooldown: 35

  - id: fall
    text: "🕳️ 낙 사"
    asset: images/낙사.png
    sfx: sfx/추락.mp3
    triggers: ["떨어졌", "낙사", "밑으로", "아래로 떨", "빠졌"]
    placement: center
    style: MemeCenter
    duration: 1.6
    weight: 1.2
    cooldown: 40

  - id: nalak
    text: "📉 나 락 행"
    asset: images/나락.png
    triggers: ["나락", "폭망", "역대급 망", "최악", "손절"]
    placement: top
    duration: 2.0
    weight: 1.1
    cooldown: 60

  # ======================= 성공 · 캐리 =======================
  - id: clutch
    text: "🏆 캐 리 시 작"
    asset: images/캐리.png
    sfx: sfx/승리.mp3
    triggers: ["이겼", "잡았", "뚫었", "클리어", "성공", "1등", "역전", "캐리"]
    placement: center
    style: MemeCenter
    duration: 1.8
    weight: 1.4
    cooldown: 30

  - id: pro_gamer
    text: "프로게이머 무브 🎮"
    asset: images/프로게이머.png
    triggers: ["개잘", "잘했", "쩐다", "개쩐", "미쳤다", "지렸", "폼 미쳤"]
    placement: top
    duration: 2.0
    weight: 1.2
    cooldown: 35

  - id: muyaho
    text: "무 야 호 🙌"
    asset: images/무야호.png
    sfx: sfx/무야호.mp3
    triggers: ["신난다", "야호", "무야호", "기분 좋", "가보자"]
    placement: center
    style: MemeCenter
    duration: 2.0
    weight: 1.3
    cooldown: 60

  - id: survived
