    cooldown: 25

  - id: shock
    text: "😱 헐"
    asset: images/충격.png
    sfx: sfx/두둥.mp3
    triggers: ["헐", "우와", "와씨", "소름", "설마", "미친"]
    placement: top
    duration: 1.5
    weight: 1.0
    cooldown: 25

  - id: king_angry
    text: "😤 킹 받 네"
