    placement: top
    duration: 2.0
    weight: 1.1
    cooldown: 45

  # ======================= 편집 연출 =======================
  - id: hype_peak
    text: "🔥 여기가 하이라이트"
    asset: images/하이라이트.png
    sfx: sfx/하이라이트.mp3
    triggers: []
    events: [hype]
    placement: top
    duration: 1.8
    weight: 1.0
    cooldown: 45

  - id: quiet
    text: "…🦗"
    asset: images/정적.png
    sfx: sfx/귀뚜라미.mp3
    triggers: []
    events: [silence]
    placement: center
    style: MemeCenter
    duration: 1.6
    weight: 0.8
    cooldown: 60

  # {gap} 자리에 건너뛴 시간이 들어갑니다 (예: "3분 후")
  - id: timeskip_card
    text: "{gap}"
    asset: images/시간경과.png
    sfx: sfx/전환.mp3
    triggers: []
    events: [timeskip]
    placement: fullscreen
    style: Card
    duration: 1.6
    weight: 1.0
    cooldown: 0

  # ======================= 시청자 유도 =======================
  - id: subscribe
    text: "👍 구독 안 하면 다음 판도 짐"
    asset: images/구독.png
    sfx: sfx/알림.mp3
    triggers: ["구독", "좋아요", "알림", "댓글"]
    placement: bottom
    duration: 2.4
    weight: 0.8
    cooldown: 120
