    triggers: ["살았", "생존", "버텼", "간신히", "겨우"]
    placement: top
    duration: 1.8
    weight: 1.1
    cooldown: 30

  - id: goat
    text: "🐐 폼 미 쳤 다"
    asset: images/goat.png
    triggers: ["레전드", "역대급", "인생", "최고", "goat"]
