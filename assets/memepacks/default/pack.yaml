    weight: 1.0
    cooldown: 60

  - id: bug
    text: "🐛 게임 탓입니다"
    asset: images/버그.png
    triggers: ["버그", "이게 왜 안", "말이 돼", "판정", "핵", "치터"]
    placement: top
    duration: 2.0
    weight: 1.0
    cooldown: 60

  - id: gamble
    text: "🎲 도박의 시간"
    asset: images/도박.png
    sfx: sfx/드럼롤.mp3
    triggers: ["뽑기", "가챠", "확률", "천장", "질러", "뽑아"]
