    triggers: ["킹받", "빡쳐", "빡친", "짜증", "화나", "열받"]
    placement: right
    duration: 2.0
    weight: 1.3
    cooldown: 30

  - id: speechless
    text: "…할 말을 잃음"
    asset: images/할말없음.png
    triggers: ["할 말이", "말이 안", "어이가", "기가 막", "어처구니"]
